<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fala! Fatec</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Css/style.css">
  <link rel="stylesheet" href="Css/navigation.css">
  <link rel="icon" type="image/x-icon" href="img/falafatec.logo.png">
</head>
<body class="bg-quadriculado" data-auth-required="true">


  <header class="navbar-container">
    <div class="navbar">
      <nav class="primary-nav" aria-label="Navegação principal">
        <a href="index.html" aria-current="page">Início</a>
        <a href="minha-conta.html">Minhas Falas</a>
        <a href="meu-perfil.html">Meu perfil</a>
      </nav>
      <div class="logo-container">
        <img src="img/falafatec.logo.png" alt="fala! fatec logo" class="logo-img">
      </div>
      <a class="nav-btn account-link" href="minha-conta.html" aria-label="Minha conta">
        <img src="img/mnConta.index.png" alt="" class="btn-img">
      </a>
    </div>
  </header>

  <main class="content-wrapper">
  
    <section class="post-section">
      <div class="post-form-container">
        <h2 class="title-post">Hoje eu quero falar de...</h2>
        
        <div class="textarea-wrapper">
          <textarea id="postText" placeholder="Escreva seu comentário aqui..."></textarea>
        </div>

        <div class="post-controls">
          <select id="categoriaSelect" class="btn-select">
            <option value="" disabled selected>Categoria</option>
            <option value="estrutura">Estrutura</option>
            <option value="laboratorios">Laboratórios</option>
            <option value="cantina">Cantina</option>
          </select>

          <select id="tipoSelect" class="btn-select">
            <option value="" disabled selected>Tipo</option>
            <option value="feedback">Feedback</option>
            <option value="sugestao">Sugestão</option>
          </select>

          <button id="btnPostar" class="btn-postar">Postar</button>
        </div>
      </div>

      <div class="stickers-container">
        <div class="sticker sticker-laboratorios">
          <span>laboratórios</span>
          <img src="img/lab.fig.png" alt="laboratórios" class="sticker-img">
        </div>
        <div class="sticker sticker-cantina">
          <span>Cantina</span>
          <img src="img/cantina.fig.png" alt="cantina" class="sticker-img">
        </div>
        <div class="sticker sticker-estrutura">
          <span>estrutura</span>
          <img src="img/infra.fig.png" alt="estrutura" class="sticker-img">
        </div>
      </div>
    </section>

    <section class="trending-section" aria-labelledby="trendingTitle">
      <div class="trending-heading">
        <img id="trendingTitle" class="trending-logo" src="img/emAlta.png" alt="Em alta">
      </div>

      <div class="trending-carousel" role="region" aria-label="Publicações em alta">
        <button id="trendPrevious" class="trend-arrow" type="button" aria-label="Publicação anterior">‹</button>
        <article class="trend-slide" aria-live="polite">
          
          <div id="trendArtwork" class="trend-artwork" role="img" aria-label="Espaço reservado para a imagem da publicação"></div>
          <div class="trend-content">
            <h2 id="trendTitle" class="trend-title"></h2>
            <p id="trendDescription" class="trend-description"></p>
            <div class="trend-reactions" aria-label="Reações">
              <div class="trend-reaction">
                <span id="trendSupportedCount" class="trend-count"></span>
                <button class="btn-reaction btn-apoiado trend-vote" type="button" data-trend-reaction="supported" aria-pressed="false">Apoiado!</button>
              </div>
              <div class="trend-reaction">
                <span id="trendDisagreedCount" class="trend-count"></span>
                <button class="btn-reaction btn-discordo trend-vote" type="button" data-trend-reaction="disagreed" aria-pressed="false">Discordo</button>
              </div>
              <div class="trend-reaction">
                <span id="trendGaggedCount" class="trend-count"></span>
                <button class="btn-reaction btn-gag trend-vote" type="button" data-trend-reaction="gagged" aria-pressed="false">Fiquei GAG</button>
              </div>
            </div>
            <p id="trendPosition" class="trend-position" aria-label="Posição no carrossel"></p>
          </div>
        </article>
        <button id="trendNext" class="trend-arrow" type="button" aria-label="Próxima publicação">›</button>
      </div>
    </section>


    <section class="feed-grid">
      
     
      <div class="feed-column">
        <h2 class="column-title feedback-title">
          <span class="star-icon"></span> feedbacks
        </h2>
        
        <div id="feedbacksList" class="cards-container">
     
          <article class="post-card">
            <div class="card-avatar">
             
               <img src="img/avatar.png" alt="avatar" class="avatar-img">
            </div>
            <div class="card-content">
              <p class="card-text">A nova cantina está linda!!</p>
              <div class="card-reactions">
                <button class="btn-reaction btn-apoiado">Apoiado!</button>
                <button class="btn-reaction btn-discordo">Discordo</button>
                <button class="btn-reaction btn-gag">Fiquei GAG</button>
              </div>
            </div>
          </article>

          <article class="post-card">
            <div class="card-avatar">
              <img src="img/avatar.png" alt="avatar" class="avatar-img">
            </div>
            <div class="card-content">
              <p class="card-text">FALTA CATUPIRY A COXINHA!!</p>
              <div class="card-reactions">
                <button class="btn-reaction btn-apoiado">Apoiado!</button>
                <button class="btn-reaction btn-discordo">Discordo</button>
                <button class="btn-reaction btn-gag">Fiquei GAG</button>
              </div>
            </div>
          </article>
        </div>
      </div>

  
      <div class="feed-column">
        <h2 class="column-title sugestoes-title">
          <span class="exclamation-icon"></span> sugestões
        </h2>
        
        <div id="sugestoesList" class="cards-container">
          <!-- Card Exemplo -->
            <div class="card-avatar">
              <img src="img/avatar.png" alt="avatar" class="avatar-img">
            </div>
            <div class="card-content">
              <p class="card-text">A nova cantina está linda!!</p>
              <div class="card-reactions">
                <button class="btn-reaction btn-apoiado">Apoiado!</button>
                <button class="btn-reaction btn-discordo">Discordo</button>
                <button class="btn-reaction btn-gag">Fiquei GAG</button>
              </div>
            </div>
          </article>
        </div>
      </div>

    </section>

    <section class="categories-section" aria-labelledby="categoriesTitle">
      <h2 class="categories-heading">
        <img id="categoriesTitle" class="categories-logo" src="img/categoria.png" alt="Categorias">
      </h2>

      <div class="categories-grid">
        <article class="category-card category-structure">
          <img class="category-image-placeholder" src="img/infra.fig.png" alt="Imagem de estrutura">
          <h3>estrutura</h3>
        </article>
        <article class="category-card category-labs">
          <img class="category-image-placeholder" src="img/lab.fig.png" alt="Imagem dos laboratórios">
          <h3>laboratórios</h3>
        </article>
        <article class="category-card category-library">
          <img class="category-image-placeholder" src="img/biblio.png" alt="Imagem da biblioteca">
          <h3>biblioteca</h3>
        </article>
        <article class="category-card category-service">
          <img class="category-image-placeholder" src="img/att.png" alt="Imagem de atendimento">
          <h3>atendimento</h3>
        </article>
        <article class="category-card category-opportunities">
          <img class="category-image-placeholder" src="img/oportu.png" alt="Imagem de oportunidades">
          <h3>oportunidades</h3>
        </article>
        <article class="category-card category-canteen">
          <img class="category-image-placeholder" src="img/cantina.fig.png" alt="Imagem da cantina">
          <h3>cantina</h3>
        </article>
        <article class="category-card category-events">
          <img class="category-image-placeholder" src="img/evento.png" alt="Imagem de eventos">
          <h3>eventos</h3>
        </article>
      </div>
    </section>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
